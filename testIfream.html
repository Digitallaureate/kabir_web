<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Kabir – Explore History</title>
  <style>
    /* reset & layout */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: sans-serif; }

    /* header */
    header {
      display: flex; align-items: center; justify-content: space-between;
      height: 60px; padding: 0 24px; background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1); position: relative;
      z-index: 10;
    }
    .logo { font-size: 1.5rem; font-weight: bold; color: #333; }
    nav ul { list-style: none; display: flex; gap: 24px; }
    nav a {
      position: relative; text-decoration: none;
      font-weight: 500; color: #333; padding: 8px 0;
    }
    nav a.active { color: #d35324; }
    nav a.active::after {
      content: ""; position: absolute; bottom: -4px;
      left: 0; width: 100%; height: 2px; background: #d35324;
    }
    .actions a {
      margin-left: 16px; text-decoration: none;
      font-weight: 500; padding: 6px 12px; border-radius: 4px;
      border: 1px solid #d35324; color: #d35324;
    }
    .actions a.primary { background: #d35324; color: #fff; }

    /* info icon + tooltip */
    .info {
      position: relative;
      margin-left: 16px;
      cursor: pointer;
    }
    .info-icon {
      width: 20px; height: 20px;
      border-radius: 50%; background: #888;
      color: #fff; display: flex;
      align-items: center; justify-content: center;
      font-size: 0.9rem; font-weight: bold;
    }
    .tooltip {
      position: absolute; top: 28px; right: 0;
      width: 200px; padding: 8px;
      background: #fff; color: #333;
      border: 1px solid rgba(0,0,0,0.1);
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      font-size: 0.85rem; line-height: 1.3;
      display: none;
      z-index: 20;
    }
    .tooltip a { color: #0066cc; text-decoration: none; }
    .tooltip a:hover { text-decoration: underline; }

    /* iframe fills remaining space */
    iframe {
      border: none; width: 100%; height: calc(100% - 60px);
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Project Kabir</div>
    <nav>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/history" class="active">Explore History</a></li>
        <li><a href="/blog">Blog</a></li>
        <li><a href="/contact">Contact</a></li>
      </ul>
    </nav>
    <div class="actions">
      <a href="/login">Login</a>
      <a href="/signup" class="primary">Sign Up</a>
    </div>
    <div class="info" id="infoToggle">
      <div class="info-icon">i</div>
      <div class="tooltip" id="infoTooltip">
        This map is embedded from
        <a href="https://www.oldmapsonline.org/" target="_blank"
           rel="noopener noreferrer">
          OldMapsOnline.org
        </a>
        —an external website. All credit to their data and interface.
      </div>
    </div>
  </header>

  <iframe
    src="https://www.oldmapsonline.org/en/history/regions#position=0.5469/0/104.6&year=2004"
    title="OldMapsOnline – Project Kabir"
  ></iframe>

  <script>
    // Toggle the tooltip on click
    const toggle = document.getElementById('infoToggle');
    const tip = document.getElementById('infoTooltip');
    toggle.addEventListener('click', () => {
      tip.style.display = tip.style.display === 'block' ? 'none' : 'block';
    });
    // Click outside to close
    document.addEventListener('click', e => {
      if (!toggle.contains(e.target)) {
        tip.style.display = 'none';
      }
    });
  </script>
</body>
</html>
